name: Update Skills Data

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install ClawHub CLI
        run: npm install -g clawhub@latest

      - name: Fetch all skills
        run: |
          # Fetch from multiple sort orders to maximize coverage
          mkdir -p /tmp/skills
          
          for sort in newest downloads trending installs rating installsAllTime; do
            echo "Fetching sort=$sort..."
            clawhub explore --json --limit 200 --sort $sort --registry "https://clawhub.ai" 2>&1 | grep -v '^- ' > /tmp/skills/$sort.json || true
          done
          
          # Merge all skills
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const allSkills = new Map();
          const dir = '/tmp/skills';
          
          for (const file of fs.readdirSync(dir)) {
            try {
              const raw = fs.readFileSync(path.join(dir, file), 'utf-8').trim();
              if (!raw) continue;
              const data = JSON.parse(raw);
              for (const item of (data.items || [])) {
                allSkills.set(item.slug, item);
              }
            } catch (e) {
              console.error(`Error reading ${file}:`, e.message);
            }
          }
          
          const skills = Array.from(allSkills.values());
          const output = {
            skills: skills,
            updatedAt: new Date().toISOString(),
            count: skills.length
          };
          
          fs.writeFileSync('skills.json', JSON.stringify(output));
          console.log(`Saved ${skills.length} skills`);
          EOF
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add skills.json

          if git diff --staged --quiet; then
            echo "No skills data changes to commit"
            exit 0
          fi

          git commit -m "Update skills data ($(date -u +%Y-%m-%d\ %H:%M) UTC)"

          # GitHub occasionally rejects a valid push with a transient
          # "fatal error in commit_refs". Retry the same commit before failing.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "git push failed after 3 attempts" >&2
          exit 1
